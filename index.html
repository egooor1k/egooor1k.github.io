<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Link Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили для темной темы */
        :root {
            --bg-color: #1c1c1d;
            --container-bg: #2c2c2e;
            --text-color: #ffffff;
            --input-bg: #3a3a3c;
            --input-border: #48484a;
            --accent-color: #0a84ff;
            --button-text: #ffffff;
            --secondary-text: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 { 
            text-align: center; 
            margin-top: 0;
            color: var(--accent-color);
            font-size: 24px;
        }

        .input-group { margin-bottom: 20px; }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: var(--secondary-text);
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        /* Убираем стрелочки у input type="number" */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield; /* Для Firefox */
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: var(--input-bg);
            border-radius: 12px;
            word-break: break-all;
            display: none;
            font-size: 14px;
            border: 1px dashed var(--input-border);
        }

        .copy-btn {
            background: #32d74b;
            margin-top: 12px;
            padding: 10px;
            font-size: 14px;
        }

        #generatedLink {
            display: block;
            margin-top: 10px;
            color: var(--accent-color);
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Zoom Generator</h2>
    
    <div class="input-group">
        <label>ID конференции</label>
        <input type="number" id="meetingId" placeholder="Например: 8501234567">
    </div>

    <div class="input-group">
        <label>Пароль (код доступа)</label>
        <input type="text" id="password" placeholder="Например: 12345">
    </div>

    <button onclick="generateLink()">Сгенерировать ссылку</button>

    <div id="resultBox" class="result">
        <span style="color: var(--secondary-text)">Готовая ссылка:</span>
        <span id="generatedLink"></span>
        <button class="copy-btn" onclick="copyLink()">Копировать ссылку</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    // Принудительно ставим темную тему для шапки в ТГ
    tg.setHeaderColor('#1c1c1d');

    function generateLink() {
        const id = document.getElementById('meetingId').value.trim();
        const pwd = document.getElementById('password').value.trim();

        if (!id) {
            alert("Введите ID");
            return;
        }

        // Прямой протокол для открытия приложения Zoom
        const link = `zoommtg://zoom.us/join?confno=${id}&pwd=${encodeURIComponent(pwd)}`;
        
        document.getElementById('generatedLink').innerText = link;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
        const linkText = document.getElementById('generatedLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            if (tg.showAlert) {
                tg.showAlert("Ссылка скопирована!");
            } else {
                alert("Скопировано!");
            }
        });
    }
</script>

</body>
</html>
