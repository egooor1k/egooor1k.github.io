<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Link Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #222);
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color, #fff);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: var(--tg-theme-button-color, #007bff); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f0fe;
            border-radius: 8px;
            word-break: break-all;
            display: none;
            font-size: 13px;
            color: #333;
        }
        .copy-btn {
            background: #28a745;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Zoom Generator</h2>
    
    <div class="input-group">
        <label>ID конференции (10-11 цифр)</label>
        <input type="number" id="meetingId" placeholder="Например: 8501234567">
    </div>

    <div class="input-group">
        <label>Пароль (код доступа)</label>
        <input type="text" id="password" placeholder="Например: 12345">
    </div>

    <button onclick="generateLink()">Сгенерировать ссылку</button>

    <div id="resultBox" class="result">
        <strong>Ваша ссылка:</strong><br>
        <span id="generatedLink"></span>
        <button class="copy-btn" onclick="copyLink()">Копировать</button>
    </div>
</div>

<script>
    // Инициализация Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Развернуть на весь экран

    function generateLink() {
        const id = document.getElementById('meetingId').value.trim();
        const pwd = document.getElementById('password').value.trim();

        if (!id) {
            alert("Введите ID конференции");
            return;
        }

        // Мы используем протокол zoommtg://
        // Он позволяет передать пароль в открытом виде, и приложение Zoom его поймет.
        // Формат: zoommtg://zoom.us/join?confno=ID&pwd=PASSWORD
        
        const link = `zoommtg://zoom.us/join?confno=${id}&pwd=${encodeURIComponent(pwd)}`;
        
        // Для браузерной версии (если не установлено приложение) 
        // прямую ссылку с паролем без API сгенерировать сложно, 
        // но эта ссылка откроет приложение напрямую.

        document.getElementById('generatedLink').innerText = link;
        document.getElementById('resultBox').style.display = 'block';
    }

    function copyLink() {
        const linkText = document.getElementById('generatedLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            tg.showAlert("Ссылка скопирована!");
        });
    }
</script>

</body>
</html>
