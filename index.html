<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Link Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1c1c1d;
            --container-bg: #2c2c2e;
            --text-color: #ffffff;
            --input-bg: #3a3a3c;
            --input-border: #48484a;
            --accent-color: #0a84ff;
            --button-text: #ffffff;
            --secondary-text: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h2 { text-align: center; margin-top: 0; color: var(--accent-color); font-size: 24px; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; }

        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--secondary-text); }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
        }

        /* Убираем стрелочки */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] { -moz-appearance: textfield; }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: var(--input-bg);
            border-radius: 12px;
            display: none;
            border: 1px dashed var(--input-border);
        }

        .result-label { font-size: 12px; color: var(--secondary-text); margin-bottom: 8px; display: block; }

        .link-text {
            word-break: break-all;
            font-size: 13px;
            color: #58a6ff;
            font-family: monospace;
            display: block;
            margin-bottom: 15px;
        }

        .copy-btn {
            background: #32d74b;
            padding: 10px;
            font-size: 14px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Zoom Generator</h2>
    
    <div class="input-group">
        <label>ID конференции</label>
        <input type="number" id="meetingId" placeholder="Например: 5373467362">
    </div>

    <div class="input-group">
        <label>Пароль (код доступа)</label>
        <input type="text" id="password" placeholder="Введите пароль">
    </div>

    <button onclick="generateZoomLink()">Сгенерировать ссылку</button>

    <div id="resultBox" class="result">
        <span class="result-label">Готовая HTTPS ссылка:</span>
        <span id="generatedLink" class="link-text"></span>
        <button class="copy-btn" onclick="copyLink()">Копировать</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor('#1c1c1d');

    // Функция для создания Zoom-хеша пароля
    async function generateZoomHash(password) {
        // 1. Кодируем пароль в UTF-8
        const msgUint8 = new TextEncoder().encode(password);
        // 2. Хешируем через SHA-256
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        // 3. Переводим в Base64
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashString = String.fromCharCode.apply(null, hashArray);
        return window.btoa(hashString);
    }

    async function generateZoomLink() {
        const id = document.getElementById('meetingId').value.trim();
        const pwd = document.getElementById('password').value.trim();

        if (!id || !pwd) {
            alert("Введите ID и Пароль");
            return;
        }

        try {
            // Генерируем хеш пароля
            const pwdHash = await generateZoomHash(pwd);
            
            // Формируем финальную ссылку
            // Очищаем хеш от символов, которые могут мешать в URL (Zoom это делает)
            const finalHash = pwdHash.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            
            const link = `https://zoom.us/j/${id}?pwd=${pwdHash}`;
            
            document.getElementById('generatedLink').innerText = link;
            document.getElementById('resultBox').style.display = 'block';
        } catch (e) {
            console.error(e);
            alert("Ошибка при генерации хеша");
        }
    }

    function copyLink() {
        const linkText = document.getElementById('generatedLink').innerText;
        navigator.clipboard.writeText(linkText).then(() => {
            if (tg.showAlert) tg.showAlert("Ссылка скопирована!");
            else alert("Скопировано!");
        });
    }
</script>

</body>
</html>
