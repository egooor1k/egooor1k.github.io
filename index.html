<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Link Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #17212b;
            --container-bg: #242f3d;
            --text-color: #f5f5f5;
            --input-bg: #1d2733;
            --input-border: #303d4d;
            --accent-color: #2ea6ff;
            --secondary-text: #708499;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 360px;
            background: var(--container-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        h2 { text-align: center; margin-top: 0; color: var(--text-color); font-size: 20px; margin-bottom: 20px; }

        .input-group { margin-bottom: 18px; }

        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--secondary-text); padding-left: 4px; }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            box-sizing: border-box;
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--accent-color); }

        /* Убираем стрелочки */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .main-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: var(--input-bg);
            border-radius: 10px;
            display: none;
            text-align: center;
        }

        .link-display {
            font-size: 12px;
            color: var(--accent-color);
            word-break: break-all;
            display: block;
            margin-bottom: 15px;
            background: rgba(46, 166, 255, 0.1);
            padding: 8px;
            border-radius: 6px;
        }

        .btn-row { display: flex; gap: 10px; }
        
        .sub-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .copy { background: #31b545; color: white; }
        .open { background: #2ea6ff; color: white; }

        .info {
            font-size: 11px;
            color: var(--secondary-text);
            margin-top: 15px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Zoom Быстрый Вход</h2>
    
    <div class="input-group">
        <label>ID конференции</label>
        <input type="number" id="meetingId" placeholder="Например: 5373467362">
    </div>

    <div class="input-group">
        <label>Пароль (код доступа)</label>
        <input type="text" id="password" placeholder="Пароль">
    </div>

    <button class="main-btn" onclick="generate()">Создать быструю ссылку</button>

    <div id="resultBox" class="result">
        <span class="link-display" id="linkTxt"></span>
        <div class="btn-row">
            <button class="sub-btn copy" onclick="copy()">Копировать</button>
            <button class="sub-btn open" id="joinBtn">Войти сейчас</button>
        </div>
    </div>

    <p class="info">Эта ссылка автоматически откроет приложение Zoom и введет пароль за вас.</p>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function generate() {
        const id = document.getElementById('meetingId').value.trim();
        const pwd = document.getElementById('password').value.trim();

        if (!id || !pwd) {
            alert("Заполните все поля");
            return;
        }

        // Это ЕДИНСТВЕННЫЙ формат, который принимает чистый пароль
        const appLink = `zoommtg://zoom.us/join?confno=${id}&pwd=${encodeURIComponent(pwd)}`;
        
        document.getElementById('linkTxt').innerText = appLink;
        document.getElementById('joinBtn').onclick = () => { window.location.href = appLink; };
        document.getElementById('resultBox').style.display = 'block';
    }

    function copy() {
        const text = document.getElementById('linkTxt').innerText;
        navigator.clipboard.writeText(text);
        if(tg.showAlert) tg.showAlert("Ссылка скопирована!");
    }
</script>

</body>
</html>
